steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/be-admin-concert', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/be-admin-concert']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'be-admin-concert'
      - '--image=gcr.io/$PROJECT_ID/be-admin-concert'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=5000'
      - '--allow-unauthenticated'
      - '--set-env-vars=DB_HOST=${_DB_HOST},DB_USER=${_DB_USER},DB_PASSWORD=${_DB_PASSWORD},DB_NAME=${_DB_NAME},DB_PORT=${_DB_PORT},JWT_SECRET=${_JWT_SECRET},INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME}'
      - '--add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}'
