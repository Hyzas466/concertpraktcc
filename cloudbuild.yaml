steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  # Step 2: Build React app dengan URL production backend
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'REACT_APP_API_URL=https://be-admin-concert-940358634558.us-central1.run.app/api/v1'
      - 'NODE_OPTIONS=--openssl-legacy-provider'

  # Step 3: Deploy ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'app'
      - 'deploy'
      - 'app.yaml'
      - '--quiet'
      - '--project=$PROJECT_ID'

options:
  logging: CLOUD_LOGGING_ONLY
