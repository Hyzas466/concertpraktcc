steps:
  # Step 1: Install dependencies dan Build Flutter Web
  - name: 'ghcr.io/cirruslabs/flutter:stable'
    args:
      - 'bash'
      - '-c'
      - |
        flutter pub get
        flutter build web --release

  # Step 2: Deploy ke Google App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - 'gcloud'
      - 'app'
      - 'deploy'
      - 'app.yaml'
      - '--project=$PROJECT_ID'
      - '--quiet'