steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/be-admin-concert'
      - '.'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/be-admin-concert'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'be-admin-concert'
      - '--image=gcr.io/$PROJECT_ID/be-admin-concert'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=5000'
      - '--allow-unauthenticated'
      # Bind ke Cloud SQL instance supaya socket /cloudsql/ tersedia
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:concert-db-instance'
      # Environment variables production
      - >-
        --set-env-vars=NODE_ENV=production,DB_USER=root,DB_NAME=concert_db,INSTANCE_CONNECTION_NAME=$PROJECT_ID:us-central1:concert-db-instance
      # Secret Manager: ambil DB_PASSWORD dan JWT_SECRET dari GCP Secrets (aman)
      - '--set-secrets=DB_PASSWORD=concert-db-password:latest,JWT_SECRET=concert-jwt-secret:latest'
      # Batasi CORS ke domain frontend kamu (ganti jika domain berbeda)
      - '--set-env-vars=CORS_ORIGIN=https://fe-admin-concert.web.app'
      # Batas memory & CPU supaya hemat resource
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--concurrency=80'
