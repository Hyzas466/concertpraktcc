steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/concert-backend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/concert-backend']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'concert-backend'
      - '--image=gcr.io/$PROJECT_ID/concert-backend'
      - '--region=asia-southeast2'
      - '--platform=managed'
      - '--set-env-vars=DB_HOST=$_DB_HOST,DB_USER=$_DB_USER,DB_PASSWORD=$_DB_PASSWORD,DB_NAME=$_DB_NAME,DB_PORT=$_DB_PORT,JWT_SECRET=$_JWT_SECRET'


