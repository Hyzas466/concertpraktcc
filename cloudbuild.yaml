steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/be-admin-concert', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/be-admin-concert']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'be-admin-concert'
      - '--image=gcr.io/$PROJECT_ID/be-admin-concert'
      - '--region=us-central1'
      - '--platform=managed'
      - '--port=5000'
      - '--allow-unauthenticated'
